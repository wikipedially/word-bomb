<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Bomb Lookup</title>
    <link rel="icon" type="image/png" href="star.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <header class="app-header">
        <img src="logo.png" alt="Word Bomb Logo" class="logo-img" />
        <h1 class="search-title">Search</h1>
      </header>
      <div class="search-controls">
        <div class="search-bar-wrapper">
          <div id="search-tokens-container"></div>
          <input type="text" id="search-input" placeholder="type prompt..." autocomplete="off"/>
          <div class="search-actions">
            <button class="sort-btn" id="sort-type-btn" title="toggle sort type">
              <i class="fa-solid fa-arrow-down-a-z" id="sort-type-icon"></i>
            </button>
            <button class="sort-btn" id="sort-dir-btn" title="toggle sort direction">
              <i class="fa-solid fa-arrow-up" id="sort-dir-icon"></i>
            </button>
            <button class="sort-btn" id="help-btn" title="regex & search guide">
              <i class="fa-solid fa-question"></i>
            </button>
          </div>
        </div>
      </div>
      <div id="results-container">
        <div class="placeholder-wrapper">
          <p class="placeholder-text">Enter a search query for results.</p>
          <p class="placeholder-hint">allows <span id="regex-help-link" class="interactive-link">RegEx</span> queries.</p>
        </div>
      </div>
    </main>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </body>
</html>
