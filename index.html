<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Bomb Lookup</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <header class="app-header">
        <img src="logo.png" alt="Word Bomb Logo" class="logo-img" />
        <h1 class="search-title">Search</h1>
      </header>
      <div class="search-controls">
        <input type="text" id="search-input" placeholder="Type prompt" autofocus/>
      </div>
      <div id="results-container">
        <p class="placeholder-text">Enter a search query for results.</p>
      </div>
    </main>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </body>
</html>
